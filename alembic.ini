# A generic, direct configuration for Alembic.
# For a real project, you might copy this from the output of
# `alembic init alembic` and then customize it.

[alembic]
# path to migration scripts
script_location = alembic

# template for migration file names, e.g. %%(year)d%%(month).2d%%(day).2d_%%(rev)s
# file_template = %%(rev)s_%%(slug)s

# sys.path entries, comma separated
# prepend_sys_path = .

# timezone for printing dates
# timezone =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Other settings you might want to configure:
# sqlalchemy.url = driver://user:pass@localhost/dbname
# Ensure this is set, especially if your env.py script relies on it.
# It's often better to load this from environment variables in env.py
# For example:
# sqlalchemy.url = postgresql://user:password@host:port/database
# OR for SQLite:
# sqlalchemy.url = sqlite:///./telegram_bot.db

# You can define other custom settings here and access them in your env.py
# via context.config.get_main_option("my_setting")
# my_custom_setting = some_value
